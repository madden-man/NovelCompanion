appId: com.maddenman.novelcompanion
productName: Novel Companion
directories:
  output: release
  buildResources: build
files:
  - out/**/*
  - package.json
asarUnpack:
  - '**/*.node'
  # ARCH-4: the Agent SDK spawns its bundled Claude Code binary, which cannot run from inside app.asar.
  - '**/node_modules/@anthropic-ai/claude-agent-sdk*/**'
mac:
  target:
    - target: dmg
      arch: [arm64]
  category: public.app-category.productivity
  # Unsigned (ad hoc) until a Developer ID is available (NF-4, A15).
  identity: null
  hardenedRuntime: false
  gatekeeperAssess: false
dmg:
  title: Novel Companion
publish: null
npmRebuild: false
